schema_version: libre-ai.project.v1
project: signalement
repository: libre-ai/signalement
kind: product
layer: couche-1
statement:
  for: "les collaborateurs qui observent un incident ou proposent une amélioration dans une application web"
  who_faces: >-
    des signalements incomplets, des preuves sensibles difficiles à relire, des
    reproductions incertaines et plusieurs systèmes de travail qui divergent
  enables: >-
    constituer un dossier relu, portable et vérifiable, le projeter sans doublon vers
    les systèmes choisis, puis reproduire le comportement et vérifier le correctif
  producing:
    - "un dossier versionné séparant déclaration, faits observés, hypothèses et preuves approuvées"
    - "un scénario exécutable avec assertions explicites et résultats traçables"
    - "des projections idempotentes et synchronisables vers plusieurs systèmes externes ou internes"
  without_depending_on:
    - "aucun fournisseur d'IA obligatoire ni fournisseur de ticketing canonique"
    - "aucun format propriétaire pour exporter dossiers, scénarios, assertions et résultats"
summary: >-
  Signalement web relu, reproduction exécutable et vérification déterministe,
  avec projections portables vers plusieurs systèmes de travail.
current_situation: >-
  La fondation est publique. Une implémentation locale de capture relue, brouillons
  chiffrés et export portable est en validation, contre le contrat v1 verrouillé.
  La qualification complète des trois navigateurs reste ouverte. La v1.0 est
  spécifiée : projection d'un Dossier, routée par une politique d'organisation, vers
  GitHub Issues, GitLab Issues, Jira Cloud et Plane auto-hébergé, avec reçus signés ;
  le gel qui la bloquait est levé (ADR-0055 de project-governance). Aucun connecteur
  fournisseur, API serveur, control plane ni worker de reproduction n'est livré. La
  v1.0 exclut la reproduction : la fiche restera sous usable-verifiable à sa sortie.
scope:
  - "Capture volontaire, bornée et relue depuis Chrome, Firefox et Safari, chacun qualifié séparément."
  - "Dossier canonique exportable avec preuves, contexte filtré et historique de redaction."
  - "Scénarios versionnés, assertions approuvées, exécution isolée et verdicts déterministes."
  - "Projections multi-destinations idempotentes, règles de conflit explicites et adaptateurs d'entreprise."
  - "API, CLI, déploiement auto-hébergeable et fonctions IA facultatives et remplaçables."
non_goals:
  - "Devenir un nouveau Jira, Linear, Plane ou autre autorité de gestion de projet."
  - "Capturer audio, corps réseau, cookies ou sessions par défaut, ou les rejouer."
  - "Laisser une IA modifier silencieusement une assertion, une référence ou un verdict."
  - "Qualifier universellement une famille fournisseur dont les éditions ont des contrats différents."
dependencies:
  - on: libre-ai/project-governance
    why: "doctrine de flotte, schéma de fiche, gates de sécurité et workflows réutilisables"
    pinned: "75d6ea085b18cb15d450d7f0f5b1ba9d69645800"
  - on: libre-ai/schemas-and-contracts
    why: "autorité verrouillée du contrat signalement-local-export-v1; les autres contrats restent futurs"
    pinned: "5b3f940c550800a9ce13f73f4bfcfdb8eba08925"
maturity: specified
confidence: medium
exposure: spec-published
freshness:
  last_verified_on: "2026-10-07"
scope_stability: stable
hypothesis: >-
  Un dossier canonique relu, doté d'un scénario et de projections idempotentes, réduit
  les pertes d'information et permet de vérifier un correctif sans imposer un nouveau
  système de ticketing aux équipes.
evidence_required:
  - "parcours complet sur application de test : capture relue, ticket réel, reproduction en échec puis correctif validé"
  - "même scénario exporté et exécuté indépendamment du service"
  - "reprise après interruption sans ticket dupliqué sur chaque profil fournisseur qualifié"
  - "zéro secret témoin dans exports, transmissions, journaux et historique public"
  - "isolation entre organizations et panne travailleur classée execution-bloquée"
promotion_criteria:
  - to: spec-published
    when: >-
      le dépôt public est clonable anonymement et reproduit exactement l'état privé
      attesté dans Governance, sans ref ou objet supplémentaire
  - to: usable-verifiable
    when: >-
      le parcours de référence traverse une extension réellement installée, deux
      connecteurs réels, un worker isolé et un export autonome avec toutes les assertions vertes
  - to: proven
    when: >-
      plusieurs organizations utilisent des profils de connecteur et navigateurs distincts,
      avec métriques publiées de reproduction, flakiness, transfert et coût machine
kill_predicates:
  - id: public-data-leak
    predicate: "un secret, identifiant personnel, artefact capturé ou configuration d'instance atteint l'historique public"
    source: tools/ci/check-public-history.ts
  - id: cross-organization-disclosure
    predicate: "une organization peut consulter ou projeter une ressource appartenant à une autre"
    source: qualification/threat-model.yaml
  - id: unsupported-fix-verdict
    predicate: "un correctif est déclaré validé alors qu'une assertion attendue n'a pas été évaluée"
    source: qualification/acceptance-catalog.yaml
  - id: duplicate-external-item
    predicate: "une reprise d'envoi crée un second item externe pour la même projection idempotente"
    source: qualification/acceptance-catalog.yaml
  - id: capability-overclaim
    predicate: "une capacité fournisseur, navigateur ou moteur est publiée sans suite de qualification exacte"
    source: qualification/decision-lock.yaml
  - id: destination-disclosure-leak
    predicate: "un fichier retenu par la politique atteint une destination"
    source: qualification/acceptance-catalog.yaml
benchmark:
  product: "Jam.dev et Marker.io pour la capture; Linear et Plane pour l'expérience d'intégration, sans devenir un ticketing"
phases:
  - id: sealed-repo
    title: "Repository publiable et historique prouvé étanche"
    exit_criteria:
      - id: boundary-red-green
        text: "Le gate de frontière rejette un canari synthétique externe au repo puis accepte l'index assaini."
        weight: 5
        status: accepted
        evidence:
          date: "2026-09-10"
          reference: "docs/evidence/2026-09-10-bootstrap-tree.md"
      - id: all-history-clean
        text: "Toutes les refs autorisées, objets accessibles et métadonnées Git destinés au premier push sont inspectés sans exclusion de chemin."
        weight: 5
        status: accepted
        evidence:
          date: "2026-09-15"
          reference: "https://github.com/libre-ai/project-governance/blob/75d6ea085b18cb15d450d7f0f5b1ba9d69645800/docs/reviews/signalement-bootstrap/8b02f8e61e1675948caaea5be3c57a898cbd624b/ATTESTATION.md"
      - id: card-and-licenses
        text: "La fiche valide et les fichiers présents sont attribués EUPL-1.2 ou CC-BY-4.0 par chemin; Apache-2.0 est réservé au futur SDK, dont le texte de licence sera ajouté avec ses premiers fichiers."
        weight: 3
        status: accepted
        evidence:
          date: "2026-09-15"
          reference: "https://github.com/libre-ai/project-governance/blob/75d6ea085b18cb15d450d7f0f5b1ba9d69645800/docs/reviews/signalement-bootstrap/8b02f8e61e1675948caaea5be3c57a898cbd624b/ATTESTATION.md"
      - id: independent-bootstrap-review
        text: "Les revues architecture, sécurité, qualité et souveraineté acceptent le même commit immuable."
        weight: 4
        status: pending
  - id: capture-qualification
    title: "Capture volontaire et qualification relue"
    exit_criteria:
      - id: browser-matrix-real
        text: "Chrome, Firefox et Safari passent chacun leur matrice réelle avec limites affichées, y compris la conservation de l'origine observée et la remise liée au geste vers l'origine configurée du control plane."
        weight: 5
        status: pending
      - id: exact-disclosure-preview
        text: "L'utilisateur retire ou masque chaque donnée avant une transmission cible explicite."
        weight: 5
        status: pending
      - id: gesture-bound-delivery
        text: "Aucune injection de l'extension sans geste, sur une origine différente de l'origine configurée du control plane ou sans confirmation ; tests rouges prouvés par neutralisation."
        weight: 5
        status: pending
      - id: resumable-local-draft
        text: "Un brouillon local reprend après interruption sans perdre sa lignée de redaction."
        weight: 3
        status: pending
  - id: multi-system-projection
    title: "Projections idempotentes et synchronisation gouvernée"
    note: "v1.0 (D13 du design du 2026-10-22) : projection seule ; internal-standard-adapter reste pending, la phase ne se clôt donc pas en v1.0."
    exit_criteria:
      - id: two-real-profiles
        text: "GitHub Issues (github.com), GitLab Issues (gitlab.com), Jira Cloud et Plane auto-hébergé passent chacun, contre une instance réelle, découverte, création, ajout, pièce jointe ou repli déclaré, reprise et conflit ; résultat consigné dans qualification/provider-matrix.yaml."
        weight: 5
        status: pending
      - id: fanout-independent-state
        text: "Une destination en échec ne masque ni ne duplique les autres projections du même Dossier."
        weight: 5
        status: pending
      - id: policy-routing
        text: "Même export, même origine observée et même politique produisent le même plan ; une destination refusée n'est jamais nommée à la personne qui signale ; aucun transmit sans règle explicite."
        weight: 5
        status: pending
      - id: signed-receipt-offline
        text: "Un reçu de projection se vérifie hors ligne avec les seules clés publiques ; un octet modifié dans le reçu ou dans un fichier transmis fait échouer la vérification."
        weight: 5
        status: pending
      - id: stale-plan-refused
        text: "Un attribut découvert modifié ou une politique retirée entre l'approbation et l'envoi produit à résoudre, jamais un envoi."
        weight: 5
        status: pending
      - id: internal-standard-adapter
        text: "Un standard maison se branche par contrat sans fork du domaine canonique."
        weight: 4
        status: pending
  - id: reproduce-verify
    title: "Reproduction exécutable et verdict déterministe"
    note: "Hors v1.0 (D13 du design du 2026-10-22) : reportée en v1.1. Conséquence assumée : la fiche ne peut pas atteindre usable-verifiable à la sortie de la v1.0, qui exige un worker isolé."
    exit_criteria:
      - id: fail-then-pass
        text: "Le même scénario échoue sur la version défectueuse et réussit sur la version corrigée."
        weight: 5
        status: pending
      - id: standalone-export
        text: "L'export s'exécute indépendamment du service avec assertions et preuves vérifiables."
        weight: 5
        status: pending
      - id: blocked-worker-verdict
        text: "Une panne du worker produit execution-bloquée et jamais un verdict de correction."
        weight: 4
        status: pending
  - id: durable-operations
    title: "Exploitation souveraine, restaurable et mesurée"
    exit_criteria:
      - id: restore-effects-disabled
        text: "Sauvegarde et restauration sont prouvées; les effets externes restent désactivés après restauration."
        weight: 4
        status: pending
      - id: bounded-costs
        text: "CPU, mémoire, réseau, stockage et coût machine sont mesurés par dossier et exécution."
        weight: 3
        status: pending
      - id: retention-deletion
        text: "Rétention, suppression des brouillons, artefacts et données de test sont prouvées."
        weight: 4
        status: pending
