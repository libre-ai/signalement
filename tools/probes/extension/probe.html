<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic capability probe</title></head>
<body>
<h1>Synthetic capability probe</h1>
<p>Use only the local synthetic fixture. No collection occurs before a button click. Audio is off.</p>
<button id="inspect" type="button">Inspect APIs and stored synthetic draft</button>
<button id="capture" type="button">Capture visible fixture</button>
<button id="write" type="button">Save synthetic draft</button>
<button id="delete" type="button">Delete synthetic draft</button>
<button id="record" type="button">Choose fixture for video (audio off)</button>
<button id="pause" type="button">Pause video</button>
<button id="resume" type="button">Resume video</button>
<button id="stop" type="button">Stop video</button>
<pre id="result" role="status" aria-live="polite">Not started</pre>
<img id="preview" alt="Local screenshot preview, never uploaded">
<script src="probe.js"></script>
</body>
</html>
