name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensing:
    uses: libre-ai/governance/.github/workflows/reusable-licensing.yml@94fc054c6b16e047eb0736e12444a08d50728efc
    with:
      tooling_ref: 94fc054c6b16e047eb0736e12444a08d50728efc
  bun-quality:
    name: Bun quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/governance/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Verify Bun revision
        run: |
          test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
          bun run check:toolchain
      - name: Prepare exact-main bootstrap checkout
        run: sh tools/ci/prepare-bootstrap-checkout.sh
      - run: bun run check
